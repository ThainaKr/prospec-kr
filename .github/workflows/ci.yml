name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          npm run lint > lint-output.txt 2>&1
          cat lint-output.txt

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-output.txt
          if-no-files-found: error

      - name: Fail if lint failed
        if: steps.lint.conclusion == 'failure'
        run: exit 1

      - name: Build
        env:
          VITE_SUPABASE_URL: https://rqrzsfgzdjyinewkrqxf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_URL: https://thainakr.github.io/prospec-kr/
        run: npm run build

      - name: Testes funcionais estruturais
        run: npm run test
